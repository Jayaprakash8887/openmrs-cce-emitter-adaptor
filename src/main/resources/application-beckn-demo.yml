# Example Beckn settings (docs/beckn-integration.md § 11). The network id, hosts and Beckn ids are made up.
# Activate with SPRING_PROFILES_ACTIVE=beckn-demo (Beckn is the default target on this branch), or copy into your own profile.
emitter:
  beckn:
    # CCE events leg (Sygnal sygnal/event/report to the HIE)
    sygnal:
      id: bap.openmrs.nextsteps.mdtlabs.org
      network-id: sygnal.nextsteps.mdtlabs.org/sygnal_demo_network_registry
      hie:
        id: bap.openhim.nextsteps.mdtlabs.org
        uri: https://hie.example.org/sygnal/receiver
    # Spice referral legs (standard Beckn)
    self:
      bap-id: bap.openmrs.example.org
      bap-uri: https://openmrs.example.org/bap/receiver
      bpp-id: bpp.openmrs.example.org
      bpp-uri: https://openmrs.example.org/bpp/receiver
    spice:
      name: Spice
      bap-id: bap.spice.example.org
      bap-uri: https://spice.example.org/bap/receiver
      bpp-id: bpp.spice.example.org
      bpp-uri: https://spice.example.org/bpp/receiver
      facility-codes: ["0417"]
      referrals-in:
        contract-id: e2c9a7b4-6f1d-4b3a-9c8e-7d6f5a4b3c2d
        transaction-id: a41f6b2c-9d3e-4a7b-8c1d-2e3f4a5b6c7d
      referrals-out:
        contract-id: 7c3d9e1f-5a2b-4d6c-8e7f-0a1b2c3d4e5f
        transaction-id: b52a7c3d-0e4f-4b8c-9d2e-3f4a5b6c7d8e
